name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Check sample logs
        run: python tests/check_samples.py

      - name: Build exe
        shell: pwsh
        run: |
          $iconArgs = @()
          if (Test-Path icon.ico) { $iconArgs = @('--icon', 'icon.ico', '--add-data', 'icon.ico;.') }
          python -m PyInstaller --clean --noconfirm --onefile --windowed `
            --name RepairFix_UART_Analyzer --hidden-import wiring_images `
            @iconArgs deck_uart_analyzer.py

      - uses: actions/upload-artifact@v4
        with:
          name: RepairFix_UART_Analyzer
          path: dist/RepairFix_UART_Analyzer.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RepairFix_UART_Analyzer.exe
          generate_release_notes: true
